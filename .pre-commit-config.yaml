repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        files: '\.py$'
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        files: '\.py$'
