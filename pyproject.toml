[project]
name = "breast-cancer-classification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime",
    "pandas",
    "pillow",
    "dvc",
    "dvc-s3",
    "kagglehub",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
include = ["*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]
